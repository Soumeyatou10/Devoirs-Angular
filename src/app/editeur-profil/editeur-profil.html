 <div class="bg-white rounded-xl shadow-md p-6">
      <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        ✏️ Éditeur de profil
        <span class="text-sm bg-green-100 text-green-700 px-2 py-1 rounded-full">Temps réel</span>
      </h3>
      
      <div class="space-y-4">
        <!-- Champ Nom -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Nom complet 🇨🇲
          </label>
          <input
            type="text"
            [(ngModel)]="nom"
            placeholder="Jean-Paul Mbarga"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
          />
        </div>
        
        <!-- Champ Âge -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Âge
          </label>
          <input
            type="number"
            [(ngModel)]="age"
            min="0"
            max="120"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
          />
        </div>
        
        <!-- Champ Bio -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Bio
          </label>
          <textarea
            [(ngModel)]="bio"
            rows="4"
            placeholder="Parlez-nous de vous..."
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent resize-none"
          ></textarea>
          <p class="text-xs text-gray-500 mt-1">
            {{ bio().length }} caractères
          </p>
        </div>
      </div>
      
      <!-- Indicateur de modification -->
      <div class="mt-4 text-xs text-green-600 flex items-center gap-1">
        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        Modification en temps réel
      </div>
    </div>
