<div class="max-w-2xl mx-auto p-6 bg-white rounded-xl shadow-lg">
      <h2 class="text-2xl font-bold mb-4">🔄 Cycle de vie des composants</h2>

      <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-lg mb-6">
        <h3 class="font-bold text-blue-800">👨 Composant Parent</h3>
        <p class="text-gray-700">Message à envoyer à l'enfant :</p>
        <div class="flex gap-2 mt-2">
          <input
            type="text"
            [(ngModel)]="messageParent"
            placeholder="Tapez votre message..."
            class="flex-1 px-3 py-2 border rounded-lg"
          />
          <button
            (click)="envoyerMessage()"
            class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">
            Envoyer
          </button>
        </div>
      </div>

      <!-- Bouton pour afficher/cacher l'enfant -->
      <div class="flex gap-2 mb-4">
        <button
          (click)="afficherEnfant = true"
          [disabled]="afficherEnfant"
          class="bg-blue-600 text-white px-4 py-2 rounded-lg disabled:opacity-50">
          Afficher l'enfant
        </button>
        <button
          (click)="afficherEnfant = false"
          [disabled]="!afficherEnfant"
          class="bg-red-600 text-white px-4 py-2 rounded-lg disabled:opacity-50">
          Détruire l'enfant
        </button>
      </div>

      <!-- Composant enfant (conditionnel) -->
      @if (afficherEnfant) {
        <app-enfant-cycle [message]="messageEnvoye" />
      }

      <p class="text-xs text-gray-500 mt-4 mt-4 p-3 bg-gray-100 rounded">
        💡 Ouvrez la console (F12) pour voir l'ordre des hooks !
      </p>
    </div>
