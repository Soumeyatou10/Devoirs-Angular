<nav class="bg-[#009970] p-4 flex justify-between items-center text-white shadow-md sticky top-0 z-50">

  <!-- Logo -->
  <h1 class="font-bold text-lg cursor-pointer" routerLink="/dashboard">DevSkill</h1>

  <!-- Menu Desktop -->
  <div class="hidden md:flex space-x-6">
    <a routerLink="/dashboard" routerLinkActive="text-white/80" class="hover:text-white/80 transition-colors cursor-pointer">Dashboard</a>
    <a routerLink="/skills" routerLinkActive="text-white/80" class="hover:text-white/80 transition-colors cursor-pointer">Compétences</a>
    <a routerLink="/challenges" routerLinkActive="text-white/80" class="hover:text-white/80 transition-colors cursor-pointer">Défis</a>
    <a routerLink="/profile" routerLinkActive="text-white/80" class="hover:text-white/80 transition-colors cursor-pointer">Profil</a>
  </div>

  <!-- Menu Burger Mobile -->
  <button
    (click)="toggleMenu()"
    class="md:hidden focus:outline-none"
  >
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
    </svg>
  </button>

  <!-- Menu Mobile Overlay -->
  <div
    *ngIf="menuOuvert"
    class="fixed inset-0 bg-black/50 z-40 md:hidden"
    (click)="fermerMenu()"
  ></div>

  <!-- Menu Mobile Slide -->
  <div
    *ngIf="menuOuvert"
    class="fixed top-0 right-0 h-full w-64 bg-[#009970] z-50 shadow-xl transition-transform duration-300 md:hidden"
  >
    <div class="p-4 border-b border-white/20 flex justify-between items-center">
      <h1 class="font-bold text-lg">DevSkill</h1>
      <button (click)="fermerMenu()" class="text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="flex flex-col p-4 space-y-4">
      <a routerLink="/dashboard" routerLinkActive="text-white/80" class="hover:text-white/80 transition-colors cursor-pointer" (click)="fermerMenu()">Dashboard</a>
      <a routerLink="/skills" routerLinkActive="text-white/80" class="hover:text-white/80 transition-colors cursor-pointer" (click)="fermerMenu()">Compétences</a>
      <a routerLink="/challenges" routerLinkActive="text-white/80" class="hover:text-white/80 transition-colors cursor-pointer" (click)="fermerMenu()">Défis</a>
      <a routerLink="/profile" routerLinkActive="text-white/80" class="hover:text-white/80 transition-colors cursor-pointer" (click)="fermerMenu()">Profil</a>
    </div>
  </div>
</nav>
